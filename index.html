<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Foxxy Music</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    button { user-select: none; -webkit-tap-highlight-color: transparent; outline: none; }
    body { background: #121212; font-family: 'Poppins', sans-serif; margin: 0; padding: 0; color: white; display: flex; flex-direction: column; align-items: center; user-select: none; }
    .search-bar { display: flex; width: 90%; max-width: 400px; margin: 20px auto; border-radius: 25px; overflow: hidden; background: #282828; }
    .search-bar input { flex: 1; border: none; padding: 12px 15px; outline: none; background: transparent; color: white; font-size: 14px; }
    .search-bar button { background: #1db954; color: white; border: none; padding: 0 15px; cursor: pointer; font-weight: bold; }
    .album-art { position: relative; width: 250px; height: 250px; border-radius: 10px; margin-top: 20px; background: #333 center/cover no-repeat; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; overflow: hidden; flex-direction: column; }
    .default-icon { fill: #1DB954; width: 90px; height: 90px; opacity: 0.6; margin-bottom: 10px; }
    .default-text { color: #1DB954; font-size: 1.8rem; font-weight: 600; opacity: 0.6; }
    .song-title { font-size: 1.2em; font-weight: 600; margin-top: 20px; text-align: center; padding: 0 15px; }
    .song-artist { font-size: 0.9em; opacity: 0.8; text-align: center; margin-top: 5px; }
    .controls { margin-top: 30px; display: flex; justify-content: center; align-items: center; gap: 15px; }
    .controls button { background: #1db954; border: none; width: 60px; height: 60px; border-radius: 50%; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.3); transition: transform 0.2s ease; display: flex; align-items: center; justify-content: center; }
    .controls button:hover { transform: scale(1.1); }
    .controls svg { width: 28px; height: 28px; fill: white; }
    #nextBtn, #volumeBtn { width: 50px; height: 50px; }
    #nextBtn svg, #volumeBtn svg { width: 22px; height: 22px; }
    .progress-container { margin-top: 25px; width: 80%; max-width: 400px; display: flex; flex-direction: column; align-items: center; }
    .time { display: flex; justify-content: space-between; width: 100%; font-size: 0.8em; opacity: 0.8; margin-bottom: 5px; }
    .progress-bar { width: 100%; -webkit-appearance: none; height: 5px; background: rgba(255,255,255,0.3); outline: none; border-radius: 5px; overflow: hidden; cursor: pointer; }
    .progress-bar::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #1db954; cursor: pointer; box-shadow: -400px 0 0 400px #1db954; }
    .volume-container { display: flex; align-items: center; position: relative; }
    #volumeControl { width: 0; opacity: 0; transition: width 0.3s ease, opacity 0.3s ease; margin-left: 5px; cursor: pointer; }
    .volume-container.show #volumeControl { width: 80px; opacity: 1; }
    #playlistPanel { display: none; position: fixed; right: 20px; bottom: 20px; width: 280px; background: #181818; padding: 12px; border-radius: 12px; max-height: 55vh; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.6); z-index: 1000; }
    #playlistPanel input { width: calc(100% - 20px); padding: 8px 10px; margin-bottom: 8px; border-radius: 6px; border: none; background: #282828; color: white; font-size: 14px; }
    #playlistPanel button { background: #1db954; border: none; color: white; padding: 6px 12px; margin-bottom: 10px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
    #playlistPanel ul { list-style: none; padding: 0; margin: 0; }
    #playlistPanel li { display: flex; align-items: center; gap: 10px; padding: 6px; border-radius: 8px; cursor: pointer; }
    #playlistPanel li:hover { background: rgba(29,185,84,0.15); }
    #playlistPanel li img { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; }
    #playlistPanel li span { flex: 1; font-size: 14px; color: #eee; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .delete-btn { margin-left: auto; background: #e63946 !important; color: white; border: none; padding: 2px 6px !important; border-radius: 4px; cursor: pointer; font-size: 12px !important; }
  </style>
</head>

<body>

  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Search a song...">
    <button onclick="searchSong()">Search</button>
    <button onclick="togglePlaylistPanel()">Playlist</button>
  </div>

  <div class="album-art" id="thumbnail">
    <svg class="default-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
      <path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/>
    </svg>
    <div class="default-text">Foxxy</div>
  </div>

  <div class="song-title" id="videoTitle">Song Title</div>
  <div class="song-artist" id="videoArtist">Artist</div>

  <div class="controls">

    <button id="playPauseBtn" onclick="togglePlay()">
      <svg id="playIcon" viewBox="0 0 24 24">
        <path d="M8 5v14l11-7z"/>
      </svg>

      <svg id="pauseIcon" style="display:none;" viewBox="0 0 24 24">
        <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
      </svg>
    </button>

    <!-- Uses YouTube's native queue next function -->
    <button id="nextBtn" onclick="playNextSong()">
      <svg viewBox="0 0 24 24">
        <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
      </svg>
    </button>

    <div class="volume-container">

      <button id="volumeBtn" onclick="toggleVolumeSlider()">
        <svg viewBox="0 0 24 24">
          <path d="M3 9v6h4l5 5V4L7 9H3z"/>
        </svg>
      </button>

      <input type="range" id="volumeControl" min="0" max="100" value="100">

    </div>

  </div>

  <div class="progress-container">

    <div class="time">
      <span id="currentTime">0:00</span>
      <span id="totalTime">0:00</span>
    </div>

    <input
      type="range"
      id="progressBar"
      class="progress-bar"
      value="0"
      min="0"
      max="100"
    >

  </div>

  <div id="playlistPanel">

    <input
      type="text"
      id="playlistInput"
      placeholder="Add song to playlist..."
    >

    <button onclick="addPlaylistInputSong()">Add</button>

    <ul id="playlist"></ul>

  </div>

  <div id="player" style="position:absolute; left:-9999px;"></div>

<script>

let player, isPlaying=false, interval, isChangingSong=false;
const apiKeys=['AIzaSyA6HuHCZSivAGvISxA4h3EglIQJgmee66k','AIzaSyCkUWUbVYjZDNRhNJBJ-NkN8ta3ga4vY3Y','AIzaSyD8TitWTpspygPuDnbilqeaLj9AG1krL48'];
let currentKeyIndex=0, currentSongIndex=-1, isDraggingProgress=false, mixQueue=[], mixPosition=-1;
let playlistSongs=JSON.parse(localStorage.getItem('playlistSongs')||'[]');
let recentSongs=JSON.parse(localStorage.getItem('foxxyRecentSongs')||'[]');
let recentArtists=JSON.parse(localStorage.getItem('foxxyRecentArtists')||'[]');
const BAD_VERSION_TERMS=['unplugged','acoustic','live','live performance','concert','instrumental','karaoke','cover','remix','slowed','reverb','sped up','nightcore','lofi','8d','mashup','fan made','fanmade','reaction','lyrics video','lyric video'];
function getApiKey(){const k=apiKeys[currentKeyIndex];currentKeyIndex=(currentKeyIndex+1)%apiKeys.length;return k}
function formatTime(sec){const m=Math.floor(sec/60),s=Math.floor(sec%60);return `${m}:${String(s).padStart(2,'0')}`}
function normalizeText(s=''){return s.toLowerCase().replace(/\[[^\]]*\]|\([^)]*\)/g,' ').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim()}
function keyOf(s){return s.videoId||s.id||normalizeText(`${s.title||s.name||''} ${s.artist||s.channel||''}`)}
function flagsOf(s=''){const text=normalizeText(s);return BAD_VERSION_TERMS.filter(x=>text.includes(x))}
function contextOf(song){const text=normalizeText(`${song.title||song.name||''} ${song.artist||song.channel||''}`);let language='english';if(/\b(tamil|tamil song)\b/.test(text))language='tamil';else if(/\b(hindi|bollywood)\b/.test(text))language='hindi';else if(/\btelugu\b/.test(text))language='telugu';else if(/\bmalayalam\b/.test(text))language='malayalam';else if(/\bkannada\b/.test(text))language='kannada';return {language,artist:normalizeText(song.artist||song.channel||''),flags:flagsOf(text)}}
function languageOK(c,ctx){const text=normalizeText(`${c.title} ${c.artist}`);const langs=['tamil','hindi','telugu','malayalam','kannada'];const found=langs.find(l=>text.includes(l));return !found||ctx.language==='english'||found===ctx.language}
function duplicateOfRecent(c){const key=keyOf(c), title=normalizeText(c.title||c.name||'');return recentSongs.includes(key)||recentSongs.some(x=>x===title)}
function acceptCandidate(c,ctx){if(!c.videoId||duplicateOfRecent(c))return false;const flags=flagsOf(`${c.title} ${c.artist}`);if(flags.length&&!ctx.flags.length)return false;if(!languageOK(c,ctx))return false;return true}
function candidateScore(c,ctx){const text=normalizeText(`${c.title} ${c.artist}`), artist=normalizeText(c.artist);const recentArtistCount=recentArtists.slice(-8).filter(a=>a===artist).length;let score=0;if(c.source==='youtube-radio')score+=70;else if(c.source==='youtube-related')score+=35;else if(c.source==='playlist')score+=15;if(!duplicateOfRecent(c))score+=45;if(c.source==='youtube-radio')score+=20;if(/official music video|official audio/.test(text))score+=30;else if(/\bofficial\b/.test(text))score+=18;if(ctx.language!=='english'&&text.includes(ctx.language))score+=35;else if(ctx.language==='english'&&!/tamil|hindi|telugu|malayalam|kannada/.test(text))score+=12;if(artist&&artist!==ctx.artist)score+=12;score-=recentArtistCount*26;score-=flagsOf(text).length*100;if(c.views>1000000)score+=7;if(c.views>10000000)score+=7;return score}
function rememberSong(song){const k=keyOf(song),t=normalizeText(song.title||song.name||''),a=normalizeText(song.artist||song.channel||'');if(k){recentSongs.push(k);if(t)recentSongs.push(t);recentSongs=[...new Set(recentSongs)].slice(-100);localStorage.setItem('foxxyRecentSongs',JSON.stringify(recentSongs))}if(a){recentArtists.push(a);recentArtists=recentArtists.slice(-30);localStorage.setItem('foxxyRecentArtists',JSON.stringify(recentArtists))}}
function onYouTubeIframeAPIReady(){player=new YT.Player('player',{height:'10',width:'10',playerVars:{autoplay:1,controls:0,modestbranding:1,rel:0},events:{onReady:onPlayerReady,onStateChange:onPlayerStateChange}})}
function onPlayerReady(){interval=setInterval(updateProgress,1000);player.setVolume(document.getElementById('volumeControl').value)}
function onPlayerStateChange(e){if(e.data===YT.PlayerState.PLAYING){isChangingSong=false;isPlaying=true;document.getElementById('playIcon').style.display='none';document.getElementById('pauseIcon').style.display='block'}else if(e.data===YT.PlayerState.PAUSED){isPlaying=false;document.getElementById('playIcon').style.display='block';document.getElementById('pauseIcon').style.display='none'}else if(e.data===YT.PlayerState.ENDED&&!isChangingSong){playNextSong()}}
function updateNextSongInfo(){const d=player&&player.getVideoData&&player.getVideoData();if(d&&d.video_id){document.getElementById('videoTitle').innerText=d.title||'Song Title';document.getElementById('videoArtist').innerText=d.author||'YouTube Mix';document.getElementById('thumbnail').style.backgroundImage=`url(https://img.youtube.com/vi/${d.video_id}/mqdefault.jpg)`}}
function playVideoData(id,title,thumb,channelTitle){isChangingSong=true;currentSongIndex=-1;mixQueue=[];mixPosition=-1;rememberSong({videoId:id,title,artist:channelTitle});if(player&&player.loadPlaylist){player.loadPlaylist({list:'RD'+id,listType:'playlist',index:0});setTimeout(()=>{isChangingSong=false},2000)}else if(player){player.loadVideoById(id);setTimeout(()=>{isChangingSong=false},2000)}document.getElementById('videoTitle').innerText=title||'Song Title';document.getElementById('videoArtist').innerText=channelTitle||'YouTube Mix';document.getElementById('thumbnail').style.backgroundImage=`url(${thumb||`https://img.youtube.com/vi/${id}/mqdefault.jpg`})`;document.querySelector('.default-icon').style.display='none';document.querySelector('.default-text').style.display='none';isPlaying=true;document.getElementById('playIcon').style.display='none';document.getElementById('pauseIcon').style.display='block';setTimeout(updateNextSongInfo,800)}
async function videoDetails(ids,source='youtube-radio'){if(!ids.length)return [];const url=`https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics&id=${ids.join(',')}&key=${getApiKey()}`;const res=await fetch(url);const data=await res.json();return (data.items||[]).map(v=>({videoId:v.id,title:v.snippet.title||'',artist:v.snippet.channelTitle||'',thumb:v.snippet.thumbnails?.medium?.url||`https://img.youtube.com/vi/${v.id}/mqdefault.jpg`,views:Number(v.statistics?.viewCount||0),source}))}
async function getYoutubeRadioCandidates(currentId){if(!player||typeof player.getPlaylist!=='function')return [];const queue=player.getPlaylist()||[];const i=queue.indexOf(currentId);const ids=queue.slice(i>=0?i+1:0).slice(0,25);return videoDetails(ids,'youtube-radio')}
async function youtubeSearch(q,max=10){const res=await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoCategoryId=10&maxResults=${max}&q=${encodeURIComponent(q)}&key=${getApiKey()}`);const data=await res.json();return (data.items||[]).map(v=>({videoId:v.id.videoId,title:v.snippet.title||'',artist:v.snippet.channelTitle||'',thumb:v.snippet.thumbnails?.medium?.url,source:'youtube-related'}))}
async function chooseStrongNextSong(){const data=player&&player.getVideoData&&player.getVideoData()||{};const current={videoId:data.video_id,title:document.getElementById('videoTitle').innerText,artist:document.getElementById('videoArtist').innerText};const ctx=contextOf(current);let candidates=[];try{candidates=await getYoutubeRadioCandidates(current.videoId)}catch(e){}let clean=candidates.filter(c=>acceptCandidate(c,ctx));if(clean.length<3){try{const related=await youtubeSearch(`${current.title} ${current.artist} similar songs`,15);clean.push(...related.filter(c=>acceptCandidate(c,ctx)))}catch(e){}}if(clean.length<2){clean.push(...playlistSongs.map(s=>({videoId:s.id,title:s.name,artist:s.channel,thumb:s.thumb,source:'playlist'})).filter(c=>acceptCandidate(c,ctx)))}clean=[...new Map(clean.map(c=>[keyOf(c),c])).values()];clean.sort((a,b)=>candidateScore(b,ctx)-candidateScore(a,ctx));return clean[0]||null}
async function playNextSong(){if(isChangingSong)return;const next=await chooseStrongNextSong();if(next)return playVideoData(next.videoId,next.title,next.thumb,next.artist);if(player&&player.nextVideo){player.nextVideo();setTimeout(updateNextSongInfo,800)}}
async function searchSong(query,save=false){query=query||document.getElementById('searchInput').value.trim();if(!query)return;const results=await youtubeSearch(query,1);if(!results.length)return;const v=results[0];if(save){playlistSongs.push({name:v.title,thumb:v.thumb,id:v.videoId,channel:v.artist});localStorage.setItem('playlistSongs',JSON.stringify(playlistSongs));updatePlaylistUI()}else playVideoData(v.videoId,v.title,v.thumb,v.artist)}
function togglePlay(){if(!player)return;isPlaying?player.pauseVideo():player.playVideo()}
function togglePlaylistPanel(){const p=document.getElementById('playlistPanel');p.style.display=p.style.display==='none'?'block':'none'}
function addPlaylistInputSong(){const v=document.getElementById('playlistInput').value.trim();if(v)searchSong(v,true);document.getElementById('playlistInput').value=''}
function updatePlaylistUI(){const ul=document.getElementById('playlist');ul.innerHTML='';playlistSongs.forEach((s,i)=>{const li=document.createElement('li'),img=document.createElement('img'),span=document.createElement('span'),del=document.createElement('button');img.src=s.thumb;span.textContent=s.name;del.textContent='X';del.className='delete-btn';li.append(img,span,del);li.onclick=e=>{if(e.target===del)return;currentSongIndex=i;playVideoData(s.id,s.name,s.thumb,s.channel)};del.onclick=e=>{e.stopPropagation();playlistSongs.splice(i,1);localStorage.setItem('playlistSongs',JSON.stringify(playlistSongs));updatePlaylistUI()};ul.appendChild(li)})}
function toggleVolumeSlider(){document.querySelector('.volume-container').classList.toggle('show')}
const progressBar=document.getElementById('progressBar');progressBar.addEventListener('mousedown',()=>isDraggingProgress=true);progressBar.addEventListener('mouseup',()=>isDraggingProgress=false);progressBar.addEventListener('change',function(){if(player&&player.getDuration)player.seekTo(this.value/100*player.getDuration(),true)});document.getElementById('volumeControl').addEventListener('input',function(){if(player)player.setVolume(this.value)});function updateProgress(){if(!player||!player.getCurrentTime)return;const c=player.getCurrentTime(),d=player.getDuration();document.getElementById('currentTime').innerText=formatTime(c);if(d){document.getElementById('totalTime').innerText=formatTime(d);if(!isDraggingProgress)progressBar.value=c/d*100}}
document.getElementById('searchInput').addEventListener('keypress',e=>{if(e.key==='Enter')searchSong()});document.getElementById('playlistInput').addEventListener('keypress',e=>{if(e.key==='Enter')addPlaylistInputSong()});updatePlaylistUI();const tag=document.createElement('script');tag.src='https://www.youtube.com/iframe_api';document.body.appendChild(tag);</script>

</body>
</html>
